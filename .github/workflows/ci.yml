name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose run --rm --build dev ruff check .
      - run: docker compose run --rm dev ruff format --check .
      - run: docker compose run --rm dev pytest
      - run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose up --build -d
      - name: Invoke the function via RIE
        run: |
          body=$(curl -sf --retry 10 --retry-all-errors --retry-delay 1 \
            -X POST http://localhost:9000/2015-03-31/functions/function/invocations -d '{}')
          echo "$body"
          test "$body" = '{"statusCode": 200, "body": "{\"result\": 200}"}'
      - run: docker compose logs
        if: always()
      - run: docker compose down
      - name: Build the deployment zip
        run: |
          docker build --platform linux/amd64 --target package --output type=local,dest=dist .
      - name: Invoke the deployment zip via RIE
        run: |
          python3 -m zipfile -e dist/project.zip dist/project
          docker run -d -p 9001:8080 -v "$PWD/dist/project:/var/task:ro" \
            -e TARGET_URL=https://example.com/ \
            public.ecr.aws/lambda/python:3.14 lambda_function.lambda_handler
          body=$(curl -sf --retry 10 --retry-all-errors --retry-delay 1 \
            -X POST http://localhost:9001/2015-03-31/functions/function/invocations -d '{}')
          echo "$body"
          test "$body" = '{"statusCode": 200, "body": "{\"result\": 200}"}'
